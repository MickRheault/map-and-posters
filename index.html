<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map &amp; Posters — Trip editor</title>
<style>
:root{color-scheme:light;--ink:#173b33;--muted:#52685e;--paper:#fcfaf2;--line:#c9cfc1;--accent:#b45132;font:15px/1.45 "DM Sans",system-ui,sans-serif;color:var(--ink);background:#e4e6dc}*{box-sizing:border-box}
body{margin:0}.topbar{padding:15px clamp(20px,3vw,52px);background:#183e34;color:#fffae9;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}.brand{font:600 22px Georgia,serif;letter-spacing:-.5px}.brand span{color:#e4b97f}.top-tools{display:flex;align-items:center;gap:16px;flex-wrap:wrap}#storage-status{font-size:13px}.mode-toggle{display:inline-flex;background:#102b24;border-radius:6px;padding:3px;gap:3px}.mode-toggle button{background:transparent;border:0;color:#d6e3dc;padding:5px 11px;min-block-size:32px;font-size:13px;font-weight:600;border-radius:4px}.mode-toggle button:hover{background:#214f42;color:#fff}.mode-toggle button[aria-pressed=true]{background:#fcfaf2;color:var(--ink)}.workspace{display:grid;grid-template-columns:minmax(330px,37%) minmax(0,1fr);min-height:calc(100vh - 62px)}aside{background:var(--paper);padding:24px clamp(18px,2.5vw,42px);border-right:1px solid var(--line)}h1{margin:0 0 14px;font:42px/1 Georgia,serif;letter-spacing:-1.8px}h2{font:26px/1.15 Georgia,serif;margin:18px 0 10px}h3{font-size:16px;margin:18px 0 8px}button,input,select,textarea{font:inherit;color:inherit;max-width:100%}button,input::file-selector-button,select{background:#fffef8;border:1px solid #aab7a8;border-radius:5px;padding:6px 10px;min-block-size:34px;cursor:pointer}button:hover{border-color:#316b56;background:#e9eee4}button:disabled{opacity:.5;cursor:default}input[type=text],input[type=number],input[type=url],textarea{background:white;border:1px solid #acb8ab;border-radius:4px;padding:7px}input[type=range],input[type=checkbox]{accent-color:#23634d}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,h2:focus-visible{outline:3px solid #bc6931;outline-offset:2px}
.stepper{margin:0 0 16px}.stepper ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}.stepper button{font-size:13px;padding:5px 9px;min-block-size:32px;border-radius:999px;background:#f2f4ec;border-color:#c9cfc1}.stepper button[aria-current=step]{background:#206248;border-color:#206248;color:white;font-weight:650}.wizard-head h2{margin:6px 0 6px;font-size:24px}.wizard-head p{margin:0 0 14px;color:var(--muted);font-size:14px}.wizard-nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px;padding-top:14px;border-top:1px solid var(--line)}.wizard-primary{background:#206248;border-color:#206248;color:white;font-weight:650}.wizard-primary:hover{background:#184e39;border-color:#184e39}.wizard-tip{background:#f2f4ec;border:1px solid var(--line);border-radius:6px;padding:12px;font-size:14px;margin:12px 0}
.file-button{display:inline-flex;align-items:center;cursor:pointer;background:#206248;color:white;font-weight:650;border-radius:6px;padding:9px 16px;min-block-size:40px;position:relative}.file-button input,.restore input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.file-button:focus-within,.restore:focus-within{outline:3px solid #bc6931}.backup-tools{display:flex;align-items:center;gap:12px;margin:16px 0 6px;flex-wrap:wrap}.restore{position:relative;text-decoration:underline;cursor:pointer;padding:4px 0}#message{font-size:14px;color:#81452e;overflow-wrap:anywhere}.tabs{display:flex;border-bottom:1px solid var(--line);gap:8px;margin:20px 0 12px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;font-weight:650}.tabs button[aria-pressed=true]{border-color:var(--accent)}fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0;padding:10px;min-width:0}legend{font-weight:600}aside svg{max-width:100%;height:auto}details{margin:10px 0}summary{cursor:pointer;font-weight:600}#output{padding:20px clamp(14px,2vw,38px);min-width:0}#output svg{max-width:100%;height:auto}#output:empty::after{content:"Import a recording to preview your poster.";color:var(--muted)}[hidden]{display:none!important}@media(max-width:850px){.workspace{grid-template-columns:minmax(300px,42%) minmax(0,1fr)}}@media(max-width:660px){.workspace{display:block}aside{border-right:0}.topbar{gap:8px}}
#assets label,#itinerary label{display:grid;gap:3px;margin:8px 0}#assets label:has(input[type=checkbox]),#itinerary label:has(input[type=checkbox]){display:flex;align-items:center;gap:6px}#assets details{padding:6px 0;border-bottom:1px solid var(--line)}#assets button,#itinerary button{margin:3px 4px 3px 0}#assets summary,.recording-row{overflow-wrap:anywhere}.recording-row small{display:block;color:#81452e}aside label input[type=range]{width:100%}
</style>
</head>
<body>
<header class="topbar"><div class="brand">Map <span>&amp;</span> Posters</div><div class="top-tools"><div class="mode-toggle" role="group" aria-label="Editor mode"><button type="button" data-mode="wizard" aria-pressed="true">Guided wizard</button><button type="button" data-mode="full" aria-pressed="false">Full editor</button></div><span id="storage-status" role="status"></span></div></header>
<main class="workspace"><aside><h1>Trip editor</h1>
<nav id="wizard-stepper" class="stepper" aria-label="Trip steps"><ol>
<li><button type="button" data-step="1" aria-current="step">1. Import GPX</button></li>
<li><button type="button" data-step="2">2. Split days</button></li>
<li><button type="button" data-step="3">3. Places</button></li>
<li><button type="button" data-step="4">4. Photos</button></li>
<li><button type="button" data-step="5">5. Style &amp; export</button></li>
</ol></nav>
<div id="wizard-head" class="wizard-head"><h2 id="wizard-heading" tabindex="-1"></h2><p id="wizard-guide"></p></div>
<div id="import-tools"><label class="file-button">Import GPX<input id="file" type="file" multiple accept=".gpx,application/gpx+xml"></label></div>
<div id="backup-tools" class="backup-tools"><button id="backup" type="button">Download backup</button><label class="restore">Restore backup<input id="restore" aria-label="Restore backup" type="file" accept=".json"></label></div>
<div id="message" role="status"></div>
<nav class="tabs" aria-label="Trip editing tools" hidden><button type="button" data-tab="itinerary" aria-pressed="true">Itinerary</button><button type="button" data-tab="assets" aria-pressed="false">Places &amp; photos</button></nav>
<div id="itinerary"></div><div id="assets" hidden></div>
<div id="wizard-step-extra"></div>
<div id="wizard-nav" class="wizard-nav"><button id="wizard-back" type="button" enterkeyhint="previous">Back</button><button id="wizard-next" class="wizard-primary" type="button" enterkeyhint="next"></button></div>
</aside>
<section id="output" aria-label="Poster studio"></section></main>
<script>(() => {
  // src/track.ts
  var rad = Math.PI / 180;
  function distance(a, b) {
    const h = Math.sin((b.lat - a.lat) * rad / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin((b.lon - a.lon) * rad / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(Math.min(1, h)));
  }
  function parseGpx(xml) {
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if (doc.documentElement.localName !== "gpx" || doc.getElementsByTagName("parsererror").length)
      throw new Error("Choose a valid GPX file.");
    return doc;
  }
  function parseTrack(input) {
    const doc = typeof input === "string" ? parseGpx(input) : input;
    function* children(el, name) {
      for (let child = el.firstElementChild;child; child = child.nextElementSibling) {
        if (child.localName === name)
          yield child;
      }
    }
    const track = [];
    for (const trk of children(doc.documentElement, "trk")) {
      for (const seg of children(trk, "trkseg")) {
        let run = [];
        for (const el of children(seg, "trkpt")) {
          const number = (value) => value?.trim() ? Number(value) : NaN;
          const lat = number(el.getAttribute("lat")), lon = number(el.getAttribute("lon"));
          if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
            if (run.length)
              track.push(run);
            run = [];
            continue;
          }
          const elevation = number(children(el, "ele").next().value?.textContent);
          const time = children(el, "time").next().value?.textContent?.trim();
          const point = { lat, lon, ele: Number.isFinite(elevation) ? elevation : null };
          if (time)
            point.time = time;
          run.push(point);
        }
        if (run.length)
          track.push(run);
      }
    }
    if (!track.length)
      throw new Error("This file contains no recorded track points.");
    return track;
  }
  function layout(track) {
    let km = 0, peak = -Infinity, low = Infinity;
    let west = Infinity, east = -Infinity, north = -Infinity, south = Infinity;
    const anchor = track[0][0].lon;
    const lines = track.map((segment) => segment.map((p, i) => {
      if (i)
        km += distance(segment[i - 1], p);
      const x = (p.lon - anchor + 540) % 360 - 180;
      const y = Math.log(Math.tan(Math.PI / 4 + Math.max(-85.0511, Math.min(85.0511, p.lat)) * rad / 2)) / rad;
      west = Math.min(west, x);
      east = Math.max(east, x);
      south = Math.min(south, y);
      north = Math.max(north, y);
      if (p.ele !== null) {
        peak = Math.max(peak, p.ele);
        low = Math.min(low, p.ele);
      }
      return { x, y, km, ele: p.ele };
    }));
    return { lines, km, peak, low, west, east, north, south };
  }

  // src/assets.ts
  function validCoordinates(lat, lon) {
    return Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  }
  var decimal = "([+-]?(?:\\d+(?:\\.\\d+)?|\\.\\d+))";
  var pair = new RegExp("^\\s*" + decimal + "\\s*,\\s*" + decimal + "\\s*$");
  function readCoordinates(value) {
    function match(value, pattern) {
      const m = pattern.exec(value);
      if (!m)
        return null;
      const lat = Number(m[1]), lon = Number(m[2]);
      return validCoordinates(lat, lon) ? { lat, lon } : null;
    }
    const direct = match(value, pair);
    if (direct)
      return direct;
    let url;
    try {
      url = new URL(value.trim());
    } catch {
      return null;
    }
    if (!["http:", "https:"].includes(url.protocol))
      return null;
    const pins = Array.from(url.pathname.matchAll(new RegExp("!3d" + decimal + "!4d" + decimal, "g")));
    if (pins.length)
      return match(pins[pins.length - 1].slice(1, 3).join(","), pair);
    for (const param of ["query", "q", "destination", "ll"]) {
      const hit = match(url.searchParams.get(param) || "", pair);
      if (hit)
        return hit;
    }
    const mlat = url.searchParams.get("mlat"), mlon = url.searchParams.get("mlon");
    if (mlat !== null && mlon !== null)
      return match([mlat, mlon].join(","), pair);
    if (/\/maps\/(?:place|search|dir)\//i.test(url.pathname))
      return null;
    return match(url.hash, new RegExp("^#map=\\d+(?:\\.\\d+)?/" + decimal + "/" + decimal + "$")) || match(url.pathname, new RegExp("/@" + decimal + "," + decimal + "(?:[,/]|$)"));
  }
  function addPlace(assets, name, coords, visible = true, category = "Place") {
    if (!validCoordinates(coords.lat, coords.lon))
      throw new Error("Enter a valid latitude and longitude.");
    const place = { id: crypto.randomUUID(), name: name.trim() || "Unnamed place", lat: coords.lat, lon: coords.lon, category, visible };
    assets.places.push(place);
    return place;
  }
  function importWaypoints(assets, input) {
    const root = (typeof input === "string" ? parseGpx(input) : input).documentElement;
    let count = 0;
    for (let el = root.firstElementChild;el; el = el.nextElementSibling) {
      if (el.localName !== "wpt")
        continue;
      const lat = el.getAttribute("lat")?.trim(), lon = el.getAttribute("lon")?.trim();
      if (!lat || !lon || !validCoordinates(Number(lat), Number(lon)))
        continue;
      const childText = (name) => Array.from(el.children).find((node) => node.localName === name)?.textContent?.trim();
      addPlace(assets, childText("name") || "Waypoint", { lat: Number(lat), lon: Number(lon) }, false, childText("type") || "Place");
      count++;
    }
    return count;
  }
  function xmlText(value) {
    return value.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function exportGpx(places, recordings) {
    const pins = places.filter((place) => place.visible).map((place) => `<wpt lat="${place.lat}" lon="${place.lon}"><name>${xmlText(place.name)}</name><type>${xmlText(place.category)}</type></wpt>`);
    const tracks = recordings.filter((r) => r.included).map((r) => {
      const segments = r.track.map((points) => "<trkseg>" + points.map((point) => `<trkpt lat="${point.lat}" lon="${point.lon}">${point.ele === null ? "" : "<ele>" + point.ele + "</ele>"}${point.time ? "<time>" + xmlText(point.time) + "</time>" : ""}</trkpt>`).join("") + "</trkseg>");
      return "<trk><name>" + xmlText(r.name) + "</name>" + segments.join("") + "</trk>";
    });
    return '<?xml version="1.0" encoding="UTF-8"?><gpx xmlns="http://www.topografix.com/GPX/1/1" version="1.1" creator="Map &amp; Posters">' + pins.join("") + tracks.join("") + "</gpx>";
  }
  function tiffGps(bytes) {
    const data = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    const order = data.getUint16(0);
    if (order !== 18761 && order !== 19789)
      return;
    const le = order === 18761;
    const u16 = (offset) => data.getUint16(offset, le);
    const u32 = (offset) => data.getUint32(offset, le);
    if (u16(2) !== 42)
      return;
    function entry(table, tag) {
      const count = u16(table);
      if (table + 2 + count * 12 > bytes.length)
        return;
      for (let i = 0;i < count; i++) {
        const offset = table + 2 + i * 12;
        if (u16(offset) === tag)
          return offset;
      }
    }
    const gpsEntry = entry(u32(4), 34853);
    if (gpsEntry === undefined || u16(gpsEntry + 2) !== 4 || u32(gpsEntry + 4) !== 1)
      return;
    const gps = u32(gpsEntry + 8);
    function coord(refTag, positive, negative) {
      const ref = entry(gps, refTag), val = entry(gps, refTag + 1);
      if (ref === undefined || val === undefined || u16(ref + 2) !== 2 || u32(ref + 4) !== 2 || u16(val + 2) !== 5 || u32(val + 4) !== 3)
        return NaN;
      const sign = String.fromCharCode(data.getUint8(ref + 8));
      if (sign !== positive && sign !== negative)
        return NaN;
      const start = u32(val + 8);
      const rational = (i) => u32(start + i * 8) / u32(start + i * 8 + 4);
      const degrees = rational(0) + rational(1) / 60 + rational(2) / 3600;
      return sign === negative ? -degrees : degrees;
    }
    const lat = coord(1, "N", "S"), lon = coord(3, "E", "W");
    if (validCoordinates(lat, lon))
      return { lat, lon };
  }
  function photoGps(buffer) {
    const bytes = new Uint8Array(buffer), view = new DataView(buffer);
    try {
      if (view.getUint16(0) === 65496) {
        for (let i = 2;i + 4 <= bytes.length && bytes[i] === 255; ) {
          const marker = bytes[i + 1], size = view.getUint16(i + 2);
          if (marker === 218 || size < 2 || i + 2 + size > bytes.length)
            break;
          if (marker === 225 && size >= 8 && view.getUint32(i + 4) === 1165519206 && view.getUint16(i + 8) === 0) {
            const gps = tiffGps(bytes.subarray(i + 10, i + 2 + size));
            if (gps)
              return gps;
          }
          i += 2 + size;
        }
      }
      if (view.getUint32(0) === 2303741511) {
        for (let i = 8;i + 12 <= bytes.length; ) {
          const size = view.getUint32(i);
          if (i + size + 12 > bytes.length)
            break;
          if (view.getUint32(i + 4) === 1700284774)
            return tiffGps(bytes.subarray(i + 8, i + 8 + size));
          i += size + 12;
        }
      }
    } catch (error) {
      if (!(error instanceof RangeError))
        throw error;
    }
  }
  function asDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader;
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => reject(new Error("Could not read the selected file."));
      reader.readAsDataURL(file);
    });
  }
  async function readPhoto(file, dayId) {
    const bytes = await file.arrayBuffer();
    const header = new DataView(bytes);
    if (bytes.byteLength < 8 || header.getUint16(0) !== 65496 && header.getUint32(0) !== 2303741511) {
      throw new Error("Choose a JPEG or PNG photo.");
    }
    const type = header.getUint16(0) === 65496 ? "image/jpeg" : "image/png";
    const image = new Image;
    const source = URL.createObjectURL(new Blob([bytes], { type }));
    try {
      image.src = source;
      await image.decode();
      const scale = Math.min(1, 2048 / Math.max(image.naturalWidth, image.naturalHeight));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
      canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
      const ctx = canvas.getContext("2d");
      if (!ctx)
        throw new Error("Could not prepare this photo.");
      ctx.fillStyle = "#fff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(image, 0, 0, canvas.width, canvas.height);
      return {
        id: crypto.randomUUID(),
        name: file.name,
        original: await asDataUrl(new Blob([bytes], { type })),
        src: canvas.toDataURL("image/jpeg", 0.92),
        dayId,
        hero: false,
        width: canvas.width,
        height: canvas.height,
        cropX: 0.5,
        cropY: 0.5,
        zoom: 1,
        gps: photoGps(bytes)
      };
    } finally {
      URL.revokeObjectURL(source);
    }
  }

  // src/itinerary.ts
  var palette = ["#aa4839", "#25678a", "#7760a2", "#167c79", "#a15513", "#8f4466", "#4e7040", "#4f5899"];
  function newDay(project, rest = false) {
    const unused = palette.find((color) => !project.days.some((day) => day.color === color));
    return { id: crypto.randomUUID(), name: rest ? "Rest day" : "", color: unused || palette[project.days.length % palette.length], rest, ranges: [] };
  }
  function dayName(project, day) {
    return "Day " + (project.days.indexOf(day) + 1) + (day.name ? " · " + day.name : "");
  }
  function firstTimestamp(track) {
    let first = NaN, previous = -Infinity;
    for (const segment of track)
      for (const point of segment) {
        const time = point.time;
        if (!time || !/^\d{4}-\d\d-\d\dT.*(?:Z|[+-]\d\d:\d\d)$/i.test(time))
          return NaN;
        const stamp = Date.parse(time);
        if (!Number.isFinite(stamp) || stamp < previous)
          return NaN;
        if (!Number.isFinite(first))
          first = stamp;
        previous = stamp;
      }
    return first;
  }
  var startTimes = new WeakMap;
  function reliableStart(track) {
    if (!startTimes.has(track))
      startTimes.set(track, firstTimestamp(track));
    return startTimes.get(track);
  }
  function importRecording(project, xml, name, document2) {
    const recording = { id: crypto.randomUUID(), name, xml, track: parseTrack(document2 ?? xml), included: true };
    appendRecording(project, recording);
    return recording;
  }
  function appendRecording(project, recording) {
    const first = reliableStart(recording.track);
    project.recordings.forEach((r, i) => {
      r.importIndex ??= i;
    });
    recording.importIndex = project.recordings.length;
    project.recordings.push(recording);
    const chronological = project.recordings.every((r) => Number.isFinite(reliableStart(r.track)));
    if (!project.manualOrder) {
      project.recordings.sort((a, b) => chronological ? reliableStart(a.track) - reliableStart(b.track) : a.importIndex - b.importIndex);
    }
    const byDate = new Map;
    function addRange(segment, start, end, date) {
      let day = byDate.get(date);
      if (!day && date && !project.manualOrder)
        day = project.days.find((d) => d.date === date && !d.rest);
      if (!day) {
        day = newDay(project);
        if (date)
          day.date = date;
        project.days.push(day);
      }
      byDate.set(date, day);
      day.ranges.push({ recordingId: recording.id, segment, start, end });
    }
    recording.track.forEach((points, segment) => {
      let start = 0;
      let date = Number.isFinite(first) ? points[0].time.slice(0, 10) : "";
      for (let i = 1;i < points.length; i++) {
        const next = date ? points[i].time.slice(0, 10) : "";
        if (next !== date) {
          addRange(segment, start, i - 1, date);
          start = i - 1;
          date = next;
        }
      }
      addRange(segment, start, points.length - 1, date);
    });
    orderRanges(project);
    if (!project.manualOrder) {
      if (chronological)
        project.days.sort((a, b) => a.date.localeCompare(b.date));
      else
        orderTravelDays(project);
    }
  }
  function orderRanges(project) {
    const order = new Map(project.recordings.map((r, i) => [r.id, i]));
    for (const day of project.days)
      day.ranges.sort((a, b) => order.get(a.recordingId) - order.get(b.recordingId) || a.segment - b.segment || a.start - b.start);
  }
  function orderTravelDays(project) {
    const order = new Map(project.recordings.map((r, i) => [r.id, i]));
    const travel = project.days.filter((d) => !d.rest);
    travel.sort((a, b) => order.get(a.ranges[0].recordingId) - order.get(b.ranges[0].recordingId));
    let i = 0;
    project.days = project.days.map((d) => d.rest ? d : travel[i++]);
  }
  function moveRecording(project, index, delta) {
    const next = index + delta;
    if (index < 0 || next < 0 || index >= project.recordings.length || next >= project.recordings.length)
      return;
    const [recording] = project.recordings.splice(index, 1);
    project.recordings.splice(next, 0, recording);
    orderRanges(project);
    orderTravelDays(project);
    project.manualOrder = true;
  }
  function dayTrack(project, day) {
    const sources = new Map(project.recordings.map((r) => [r.id, r]));
    return day.ranges.flatMap((r) => {
      const src = sources.get(r.recordingId);
      return src?.included ? [src.track[r.segment].slice(r.start, r.end + 1)] : [];
    });
  }
  function insertRestDay(project, index, name = "Rest day") {
    const day = newDay(project, true);

        render();
      } catch (error) {
        project = previous;
        render();
        throw error;
      }
      changed();
      message.textContent = "Restored " + file.name;
    } catch (error) {
      message.textContent = "Could not restore this backup. " + error.message;
    } finally {
      busy(false);
      restoreInput.value = "";
    }
  };
  document.querySelectorAll("[data-mode]").forEach((button) => {
    button.onclick = () => {
      const next = button.dataset.mode === "full" ? "full" : "wizard";
      if (next === mode)
        return;
      mode = next;
      render();
    };
  });
  document.querySelectorAll("[data-step]").forEach((button) => {
    button.onclick = () => goStep(Number(button.dataset.step));
  });
  wizardBack.onclick = () => goStep(step - 1);
  wizardNext.onclick = () => goStep(step + 1);
  document.querySelectorAll("[data-tab]").forEach((button) => {
    button.onclick = () => {
      fullTab = button.dataset.tab === "assets" ? "assets" : "itinerary";
      document.querySelectorAll("[data-tab]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
      syncChrome();
    };
  });
  async function start() {
    busy(true);
    try {
      project = await loadProject() || project;
      status.textContent = project.sources.length ? "Saved on this device" : "";
    } catch {
      status.textContent = "Local save unavailable · Download a backup";
    } finally {
      render();
      busy(false);
    }
  }
  start();
})();
</script></body></html>
