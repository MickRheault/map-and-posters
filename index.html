<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map &amp; Posters</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,Helvetica,Arial,sans-serif;color:#163e38;background:#e1e5da}header{padding:18px 4vw;background:#163e38;color:#fff9e8;font-weight:700;font-size:20px}main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;min-height:calc(100vh - 66px)}aside{padding:36px 28px;background:#f8f7ef}h1{font:normal 38px/1.1 Georgia,serif;margin:0 0 32px}label{display:block;font-weight:bold;margin:24px 0 8px}input,button{font:inherit;max-width:100%}input[type=text]{width:100%;padding:10px;border:1px solid #aeb8a7;border-radius:4px}input::file-selector-button,button{padding:10px 16px;cursor:pointer;border-radius:4px;border:1px solid #52796a}button{background:#175847;color:white;margin-top:25px}button:disabled{opacity:.5;cursor:default}#status{overflow-wrap:anywhere;font-size:14px}section{display:grid;place-items:center;padding:24px}#preview{width:min(100%,62vh);text-align:center}svg{width:100%;height:auto;display:block;box-shadow:0 6px 26px #263d302b} @media(max-width:720px){main{grid-template-columns:1fr}}
</style><header>Map &amp; Posters</header><main><aside><h1>Trip poster</h1><label for="file">GPX recording</label><input type="file" id="file" accept=".gpx,application/gpx+xml"><label for="title">Poster title</label><input type="text" id="title" maxlength="50" disabled><button id="save" disabled>Download JPG</button><p role="status" id="status"></p></aside><section aria-label="Poster preview"><div id="preview">Choose a GPX recording to preview your trip.</div></section></main><script>(() => {
  // src/track.ts
  var rad = Math.PI / 180;
  function distance(a, b) {
    const h = Math.sin((b.lat - a.lat) * rad / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin((b.lon - a.lon) * rad / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(Math.min(1, h)));
  }
  function parseTrack(xml) {
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if (doc.documentElement.localName !== "gpx" || doc.getElementsByTagName("parsererror").length)
      throw new Error("Choose a valid GPX file.");
    function* children(el, name) {
      for (let child = el.firstElementChild;child; child = child.nextElementSibling) {
        if (child.localName === name)
          yield child;
      }
    }
    const track = [];
    for (const trk of children(doc.documentElement, "trk")) {
      for (const seg of children(trk, "trkseg")) {
        let run = [];
        for (const el of children(seg, "trkpt")) {
          const number = (value) => value?.trim() ? Number(value) : NaN;
          const lat = number(el.getAttribute("lat")), lon = number(el.getAttribute("lon"));
          if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
            if (run.length)
              track.push(run);
            run = [];
            continue;
          }
          const elevation = number(children(el, "ele").next().value?.textContent);
          run.push({ lat, lon, ele: Number.isFinite(elevation) ? elevation : null });
        }
        if (run.length)
          track.push(run);
      }
    }
    if (!track.length)
      throw new Error("This file contains no recorded track points.");
    return track;
  }
  function layout(track) {
    let km = 0, peak = -Infinity, low = Infinity;
    let west = Infinity, east = -Infinity, north = -Infinity, south = Infinity;
    const anchor = track[0][0].lon;
    const lines = track.map((segment) => segment.map((p, i) => {
      if (i)
        km += distance(segment[i - 1], p);
      const x = (p.lon - anchor + 540) % 360 - 180;
      const y = Math.log(Math.tan(Math.PI / 4 + Math.max(-85.0511, Math.min(85.0511, p.lat)) * rad / 2)) / rad;
      west = Math.min(west, x);
      east = Math.max(east, x);
      south = Math.min(south, y);
      north = Math.max(north, y);
      if (p.ele !== null) {
        peak = Math.max(peak, p.ele);
        low = Math.min(low, p.ele);
      }
      return { x, y, km, ele: p.ele };
    }));
    return { lines, km, peak, low, west, east, north, south };
  }

  // src/poster.ts
  var escape = (s) => s.replace(/[<>&"']/g, (c) => "&#" + c.charCodeAt(0) + ";");
  var fmt = (n) => n.toFixed(1);
  function poster(track, title) {
    const { lines, km, peak, low, west, east, north, south } = layout(track);
    const hasProfile = Number.isFinite(peak);
    const height = hasProfile ? 760 : 940;
    const scale = Math.min(900 / (east - west || 0.000000001), height / (north - south || 0.000000001));
    const paths = lines.map((line) => {
      const coords = line.map((p) => [fmt(540 + (p.x - (east + west) / 2) * scale), fmt(190 + height / 2 - (p.y - (north + south) / 2) * scale)]);
      return coords.length === 1 ? '<circle cx="' + coords[0][0] + '" cy="' + coords[0][1] + '" r="5"/>' : '<path d="M' + coords.join(" L") + '" fill="none"/>';
    }).join("");
    const label = (x, y, size, str) => `<text x="${x}" y="${y}" font-size="${size}">${escape(str)}</text>`;
    let profile = "";
    if (hasProfile) {
      for (const line of lines) {
        let finish = function() {
          if (run.length)
            profile += '<path d="M' + run.join(" L") + (run.length === 1 ? " l0.1 0" : "") + '"/>';
          run = [];
        };
        let run = [];
        for (const p of line) {
          if (p.ele === null) {
            finish();
            continue;
          }
          run.push(fmt(64 + 952 * p.km / (km || 1)) + "," + fmt(1138 - 84 * (p.ele - low) / (peak - low || 1)));
        }
        finish();
      }
    }
    const name = title.trim() || "Untitled trip";
    return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-label="Trip poster" font-family="Helvetica, Arial, sans-serif" fill="#163e38">
    <defs><pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#c6cdbd" stroke-width="1"/></pattern></defs>
    <rect width="1080" height="1350" fill="#f4f1e6"/>
    <text x="60" y="115" font-weight="700" font-size="${Math.min(76, 1460 / Math.max(1, name.length))}">${escape(name)}</text>
    <rect x="40" y="155" width="1000" height="${height + 70}" fill="url(#grid)"/>
    <g stroke="#126c5f" fill="#126c5f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">${paths}</g>
    ${hasProfile ? label(64, 1025, 30, "Elevation") + '<g fill="none" stroke="#126c5f" stroke-width="5" stroke-linecap="round">' + profile + "</g>" : ""}
    <rect y="1180" width="1080" height="170" fill="#163e38"/>
    <g fill="#faf6e8">${label(64, 1235, 30, "Recorded distance")}${label(64, 1310, 62, fmt(km) + " km")}${hasProfile ? label(590, 1235, 30, "Highest recorded") + label(590, 1310, 62, Math.round(peak) + " m") : ""}</g></svg>`;
  }

  // src/app.ts
  var field = (id) => document.querySelector("#" + id);
  var input = field("file");
  var title = field("title");
  var save = field("save");
  var preview = field("preview");
  var status = field("status");
  var track = [];
  var revision = 0;
  function render() {
    preview.innerHTML = poster(track, title.value);
  }
  input.onchange = async () => {
    const file = input.files?.[0];
    if (!file)
      return;
    const id = ++revision;
    save.disabled = true;
    try {
      const data = parseTrack(await file.text());
      if (id !== revision)
        return;
      track = data;
      title.value = file.name.replace(/\.gpx$/i, "").slice(0, 50);
      title.disabled = false;
      render();
      status.textContent = file.name;
    } catch (e) {
      if (id === revision)
        status.textContent = e.message;
    } finally {
      if (id === revision) {
        save.disabled = !track.length;
        input.value = "";
      }
    }
  };
  title.oninput = render;
  save.onclick = async () => {
    const name = title.value.trim() || "Trip";
    const id = revision;
    const url = URL.createObjectURL(new Blob([preview.innerHTML], { type: "image/svg+xml;charset=utf-8" }));
    save.disabled = true;
    try {
      const img = new Image;
      img.src = url;
      await img.decode();
      const canvas = document.createElement("canvas");
      canvas.width = 1080;
      canvas.height = 1350;
      canvas.getContext("2d").drawImage(img, 0, 0);
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.95));
      if (!blob)
        throw new Error;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name + ".jpg";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      if (revision === id)
        status.textContent = "JPG ready · " + name;
    } catch {
      if (revision === id)
        status.textContent = "Could not export the poster. Please try again.";
    } finally {
      URL.revokeObjectURL(url);
      if (revision === id)
        save.disabled = false;
    }
  };
})();
</script></html>
