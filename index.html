<body>
<header class="topbar"><div class="brand">Map <span>&amp;</span> Posters</div><div class="top-tools"><button id="open-wizard" class="top-wizard-btn" type="button">Guided wizard</button><span id="storage-status" role="status"></span></div></header>
<main class="workspace"><aside><h1>Trip editor</h1>
<label class="file-button">Import GPX<input id="file" type="file" multiple accept=".gpx,application/gpx+xml"></label>
<div class="backup-tools"><button id="backup" type="button">Download backup</button><label class="restore">Restore backup<input id="restore" aria-label="Restore backup" type="file" accept=".json"></label><button id="reset-trip" type="button">New trip</button></div>
<div id="message" role="status"></div>
<nav class="tabs" aria-label="Trip editing tools"><button type="button" data-tab="itinerary" aria-pressed="true">Itinerary</button><button type="button" data-tab="assets" aria-pressed="false">Places &amp; photos</button></nav>
<div id="itinerary"></div><div id="assets" hidden></div></aside>
<section id="output" aria-label="Poster studio"></section></main>
<dialog id="wizard-dialog" aria-labelledby="wizard-heading">
  <div class="wiz-top">
    <div class="wiz-progress">
      <nav class="wiz-dots" aria-label="Trip steps"><ol>
        <li><button type="button" data-step="1" aria-label="Step 1: Add your GPX" aria-current="step"></button></li>
        <li><button type="button" data-step="2" aria-label="Step 2: Split into days"></button></li>
        <li><button type="button" data-step="3" aria-label="Step 3: Pick stops"></button></li>
        <li><button type="button" data-step="4" aria-label="Step 4: Add photos"></button></li>
        <li><button type="button" data-step="5" aria-label="Step 5: Ready to download"></button></li>
      </ol></nav>
      <span id="wizard-counter" class="wiz-counter">1 / 5</span>
    </div>
    <button id="wizard-exit" class="wiz-exit" type="button">Full editor</button>
  </div>
  <div class="wiz-body">
    <h1 id="wizard-heading" tabindex="-1"></h1>
    <div id="wizard-content"></div>
    <p id="wizard-status" class="wiz-status" role="status"></p>
  </div>
  <div class="wiz-foot" id="wizard-foot">
    <button id="wizard-back" type="button">Back</button>
    <button id="wizard-next" class="wiz-primary" type="button"></button>
  </div>
</dialog>
<script>(() => {
  // src/track.ts
  var rad = Math.PI / 180;
  function distance(a, b) {
    const h = Math.sin((b.lat - a.lat) * rad / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin((b.lon - a.lon) * rad / 2) ** 2;
    return 12742 * Math.asin(Math.sqrt(Math.min(1, h)));
  }
  function parseGpx(xml) {
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    if (doc.documentElement.localName !== "gpx" || doc.getElementsByTagName("parsererror").length)
      throw new Error("Choose a valid GPX file.");
    return doc;
  }
  function parseTrack(input) {
    const doc = typeof input === "string" ? parseGpx(input) : input;
    function* children(el, name) {
      for (let child = el.firstElementChild;child; child = child.nextElementSibling) {
        if (child.localName === name)
          yield child;
      }
    }
    const track = [];
    for (const trk of children(doc.documentElement, "trk")) {
      for (const seg of children(trk, "trkseg")) {
        let run = [];
        for (const el of children(seg, "trkpt")) {
          const number = (value) => value?.trim() ? Number(value) : NaN;
          const lat = number(el.getAttribute("lat")), lon = number(el.getAttribute("lon"));
          if (!Number.isFinite(lat) || !Number.isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
            if (run.length)
              track.push(run);
            run = [];
            continue;
          }
          const elevation = number(children(el, "ele").next().value?.textContent);
          const time = children(el, "time").next().value?.textContent?.trim();
          const point = { lat, lon, ele: Number.isFinite(elevation) ? elevation : null };
          if (time)
            point.time = time;
          run.push(point);
        }
        if (run.length)
          track.push(run);
      }
    }
    if (!track.length)
      throw new Error("This file contains no recorded track points.");
    return track;
  }
  function layout(track) {
    let km = 0, peak = -Infinity, low = Infinity;
    let west = Infinity, east = -Infinity, north = -Infinity, south = Infinity;
    const anchor = track[0][0].lon;
    const lines = track.map((segment) => segment.map((p, i) => {
      if (i)
        km += distance(segment[i - 1], p);
      const x = (p.lon - anchor + 540) % 360 - 180;
      const y = Math.log(Math.tan(Math.PI / 4 + Math.max(-85.0511, Math.min(85.0511, p.lat)) * rad / 2)) / rad;
      west = Math.min(west, x);
      east = Math.max(east, x);
      south = Math.min(south, y);
      north = Math.max(north, y);
      if (p.ele !== null) {
        peak = Math.max(peak, p.ele);
        low = Math.min(low, p.ele);
      }
      return { x, y, km, ele: p.ele };
    }));
    return { lines, km, peak, low, west, east, north, south };
  }

  // src/assets.ts
  function validCoordinates(lat, lon) {
    return Number.isFinite(lat) && Number.isFinite(lon) && Math.abs(lat) <= 90 && Math.abs(lon) <= 180;
  }
  var decimal = "([+-]?(?:\\d+(?:\\.\\d+)?|\\.\\d+))";
  var pair = new RegExp("^\\s*" + decimal + "\\s*,\\s*" + decimal + "\\s*$");
  function readCoordinates(value) {
    function match(value, pattern) {
      const m = pattern.exec(value);
      if (!m)
        return null;
      const lat = Number(m[1]), lon = Number(m[2]);
      return validCoordinates(lat, lon) ? { lat, lon } : null;
    }
    const direct = match(value, pair);
    if (direct)
      return direct;
    let url;
    try {
      url = new URL(value.trim());
    } catch {
      return null;
    }
    if (!["http:", "https:"].includes(url.protocol))
      return null;
    const pins = Array.from(url.pathname.matchAll(new RegExp("!3d" + decimal + "!4d" + decimal, "g")));
    if (pins.length)
      return match(pins[pins.length - 1].slice(1, 3).join(","), pair);
    for (const param of ["query", "q", "destination", "ll"]) {
      const hit = match(url.searchParams.get(param) || "", pair);
      if (hit)
        return hit;
    }
    const mlat = url.searchParams.get("mlat"), mlon = url.searchParams.get("mlon");
    if (mlat !== null && mlon !== null)
      return match([mlat, mlon].join(","), pair);
    if (/\/maps\/(?:place|search|dir)\//i.test(url.pathname))
      return null;
    return match(url.hash, new RegExp("^#map=\\d+(?:\\.\\d+)?/" + decimal + "/" + decimal + "$")) || match(url.pathname, new RegExp("/@" + decimal + "," + decimal + "(?:[,/]|$)"));
  }
  function addPlace(assets, name, coords, visible = true, category = "Place") {
    if (!validCoordinates(coords.lat, coords.lon))
      throw new Error("Enter a valid latitude and longitude.");
    const place = { id: crypto.randomUUID(), name: name.trim() || "Unnamed place", lat: coords.lat, lon: coords.lon, category, visible };
    assets.places.push(place);
    return place;
  }

          subtitle: suggestion.subtitle,
          coords: suggestion.coords,
          provider: suggestion.provider

  function snapPlaceToRoute(samples, target, toleranceKm = 0.5) {
    if (samples.length < 3 || !validCoordinates(target.lat, target.lon))
      return [];
    const goal = { lat: target.lat, lon: target.lon, ele: null };
    const distances = new Array(samples.length).fill(Infinity);
    let best = Infinity;
    for (let i = 1;i < samples.length - 1; i++) {
      const d = distance(goal, { lat: samples[i].lat, lon: samples[i].lon, ele: null });
      distances[i] = d;
      if (d < best)
        best = d;
    }
    if (!Number.isFinite(best))
      return [];
    const threshold = best + toleranceKm;
    const candidates = [];
    for (let i = 1;i < samples.length - 1; i++) {
      if (distances[i] > threshold)
        continue;
      const run = samples[i].run;
      let bestIdx = i;
      let j = i + 1;
      while (j < samples.length - 1 && samples[j].run === run && distances[j] <= threshold) {
        if (distances[j] < distances[bestIdx])
          bestIdx = j;
        j++;
      }
      candidates.push({
        index: bestIdx,
        km: samples[bestIdx].km,
        distanceKm: distances[bestIdx]
      });
      i = j - 1;
    }
    return candidates;
  }

    const px = (x) => (180 + (x - (bounds.east + bounds.west) / 2) * scale).toFixed(1);
    const py = (y) => (70 - (y - (bounds.north + bounds.south) / 2) * scale).toFixed(1);
    const svg = svgEl("svg", { viewBox: "0 0 360 140", class: "wiz-mini-map", "aria-label": "Route preview" });
    for (const line of bounds.lines) {

      keyToggle.setAttribute("aria-expanded", "false");
      keyToggle.setAttribute("aria-controls", "wiz-places-key-panel");
      const clearKeyBtn = btn("Clear", () => {
        setGooglePlacesKey("");
        keyInput.value = "";
        keyPanel.hidden = true;
        keyToggle.setAttribute("aria-expanded", "false");
        syncKeyUi();
        setStatus("Cleared Google Places key — using OpenStreetMap search.");
        keyToggle.focus();
      }, "wiz-link");
      const saveKeyBtn = btn("Save key", () => {
        const saved = setGooglePlacesKey(keyInput.value);
        keyPanel.hidden = true;
        keyToggle.setAttribute("aria-expanded", "false");
        syncKeyUi();
        setStatus(saved ? "Google Places key saved in this browser only." : "Cleared Google Places key — using OpenStreetMap search.");
        keyToggle.focus();
      }, "wiz-ghost");
      keyInput.addEventListener("keydown", (e) => {
        if (e.isComposing)
          return;
        if (e.key === "Enter") {
          e.preventDefault();
          saveKeyBtn.click();
        } else if (e.key === "Escape") {
          e.preventDefault();
          e.stopPropagation();
          keyPanel.hidden = true;
          keyToggle.setAttribute("aria-expanded", "false");
          keyToggle.focus();
        }
      });
      function syncKeyUi() {
        const active = Boolean(getGooglePlacesKey());
        providerNote.textContent = active ? "Search: Google Places (this browser)" : "Search: OpenStreetMap (free)";
        keyToggle.textContent = active ? "Google key · active" : "Google key";
        clearKeyBtn.hidden = !active;
      }
      syncKeyUi();
      keyRow.append(keyInput, saveKeyBtn, clearKeyBtn);
      keyPanel.append(keyLabel, keyRow, keyNote);
      keyBar.append(providerNote, keyToggle);
      panel.append(form, suggestions, keyBar, keyPanel);
      content.append(panel);
    }
    function renderStep4(project) {
      const bar = el("div", "", "wiz-photo-bar");
      const input = el("input");
      input.id = "wizard-photos";
      input.type = "file";
      input.multiple = true;
      input.accept = "image/jpeg,image/png,.jpg,.jpeg,.png";
      input.disabled = busy;
      const daySel = el("select", "", "wiz-select");
      daySel.id = "wizard-photo-day";
      daySel.setAttribute("aria-label", "Assign photos to");
      const fullOpt = el("option", "Full trip");
      fullOpt.value = "";
      daySel.add(fullOpt);
      for (const d of project.days) {
        const opt = el("option", dayName(project, d));
        opt.value = d.id;
        daySel.add(opt);
      }
      if (photoDayId && project.days.some((d) => d.id === photoDayId))
        daySel.value = photoDayId;
      else
        photoDayId = "";
      daySel.onchange = () => {
        photoDayId = daySel.value;
      };
      input.onchange = async () => {
        const batch = Array.from(input.files || []);
        input.value = "";
        if (!batch.length)
          return;
        busy = true;
        setStatus("Adding photos…");
        render();
        const loaded = [], errors = [];
        for (const file of batch) {
          try {
            loaded.push(await readPhoto(file, photoDayId));
          } catch {
            errors.push(file.name);
          }
        }
        project.photos.push(...loaded);
        busy = false;
        setStatus(errors.length ? "Could not read " + errors.join(", ") : "");
        if (loaded.length)
          mutate();
        else
          render();
      };
      const pick = el("label", "Choose photos", "wiz-cta-file");
      pick.append(input);
      bar.append(pick);
      if (project.days.length)
        bar.append(daySel);
      content.append(bar);
      if (!project.photos.length)
        return;
      const grid = el("div", "", "wiz-photo-grid");
      project.photos.forEach((photo, i) => {
        const card = el("div", "", "wiz-photo");
        const img = el("img");
        img.src = photo.src;
        img.alt = photo.name;
        const meta = el("div", "", "wiz-photo-actions");
        const lead = btn("Lead", () => {
          const next = !photo.hero;
          if (next) {
            for (const s of project.photos)
              if (s.dayId === photo.dayId)
                s.hero = false;
          }
          photo.hero = next;
          mutate();
        }, "wiz-chip");
        lead.setAttribute("aria-pressed", String(photo.hero));
        const cropBtn = btn("Crop", () => {
          expandedCropPhotoId = expandedCropPhotoId === photo.id ? "" : photo.id;
          render();
        }, "wiz-chip");
        cropBtn.setAttribute("aria-pressed", String(expandedCropPhotoId === photo.id));
        meta.append(lead, cropBtn);
        if (photo.gps) {
          const pinned = Boolean(photo.placeId && project.places.some((p) => p.id === photo.placeId));
          const pinBtn = btn("Pin GPS", () => {
            if (pinned) {
              const placeId = photo.placeId;
              project.places = project.places.filter((p) => p.id !== placeId);
              project.visits = project.visits.filter((v) => v.placeId !== placeId);
              delete photo.placeId;
            } else {
              const place = addPlace(project, photo.name.replace(/\.[^.]+$/, ""), photo.gps);
              photo.placeId = place.id;
              if (photo.dayId)
                project.visits.push({ id: crypto.randomUUID(), placeId: place.id, dayId: photo.dayId, overnight: false });
            }
            mutate();
          }, "wiz-chip");
          pinBtn.setAttribute("aria-pressed", String(pinned));
          meta.append(pinBtn);
        }
        const del = btn("×", () => {
          project.photos.splice(i, 1);
          mutate();
        }, "wiz-icon");
        del.setAttribute("aria-label", "Remove " + photo.name);
        meta.append(del);
        card.append(img, meta);
        if (expandedCropPhotoId === photo.id) {
          const sliders = el("div", "", "wiz-crop-box");
          for (const [labelText, key, min, max] of [["Horizontal crop", "cropX", 0, 1], ["Vertical crop", "cropY", 0, 1], ["Crop zoom", "zoom", 1, 3]]) {
            const s = el("input");
            s.type = "range";
            s.min = String(min);
            s.max = String(max);
            s.step = "0.01";
            s.value = String(photo[key]);
            s.setAttribute("aria-label", labelText);
            s.onchange = () => {
              photo[key] = Number(s.value);
              mutate();
            };
            const l = el("label", labelText.split(" ")[0] + " ");
            l.append(s);
            sliders.append(l);
          }
          card.append(sliders);
        }
        grid.append(card);
      });
      content.append(grid);
    }
    function renderStep5(project) {
      if (!project.days.length && !project.photos.length) {
        content.append(btn("Go to Step 1", () => go(1), "wiz-ghost"));
        return;
      }
      const targets = availablePosters(project);
      const state = project.output;
      const target = targets.find((t) => t.key === state.active) || targets[0];
      const controls = el("div", "", "wiz-export-top");
      const titleIn = el("input", "", "wiz-input");
      titleIn.id = "wizard-title";
      titleIn.type = "text";
      titleIn.maxLength = 100;
      titleIn.value = state.title;
      titleIn.placeholder = "Trip title";
      titleIn.setAttribute("aria-label", "Trip title");
      titleIn.onchange = () => {
        state.title = titleIn.value;
        mutate();
      };
      controls.append(titleIn);
      if (targets.length > 1) {
        const targetSel = el("select", "", "wiz-select");
        targetSel.id = "wizard-poster-target";
        targetSel.setAttribute("aria-label", "Poster");
        for (const t of targets) {
          const opt = el("option", t.name);
          opt.value = t.key;
          if (t.key === target.key)
            opt.selected = true;
          targetSel.add(opt);
        }
        targetSel.onchange = () => {
          state.active = targetSel.value;
          mutate();
        };
        controls.append(targetSel);
      }
      const phone = el("input");
      phone.id = "wizard-phone";
      phone.type = "checkbox";
      phone.checked = state.phone;
      phone.onchange = () => {
        state.phone = phone.checked;
        mutate();
      };
      const phoneLbl = el("label", "", "wiz-check");
      phoneLbl.append(phone, el("span", "Phone"));
      controls.append(phoneLbl);
      content.append(controls);
      const svgText = renderPoster(project, target.key);
      const preview = el("div", "", "wiz-preview");
      preview.id = "wizard-preview";
      if (state.phone)
        preview.classList.add("is-phone");
      preview.innerHTML = svgText;
      wireLabelEditing(preview.querySelector("svg"), target.key, state, mutate, dialog);
      content.append(preview);
      const actions = el("div", "", "wiz-export-bar");
      const fmt = el("select", "", "wiz-select-sm");
      fmt.id = "wizard-format";
      fmt.setAttribute("aria-label", "File format");
      for (const [v, l] of [["jpg", "JPG"], ["png", "PNG"]]) {
        const opt = el("option", l);
        opt.value = v;
        if (state.format === v)
          opt.selected = true;
        fmt.add(opt);
      }
      fmt.onchange = () => {
        state.format = fmt.value === "png" ? "png" : "jpg";
        mutate();
      };
      const files = posterFiles(project, targets);
      const dlBtn = btn("Download " + state.format.toUpperCase(), async () => {
        dlBtn.disabled = true;
        setStatus("Preparing…");
        try {
          const blob = await rasterize(svgText, state.format);
          downloadBlob(blob, files.find((f) => f.target.key === target.key).name);
          setStatus("Downloaded.");
        } catch (e) {
          setStatus(e instanceof Error ? e.message : "Download failed.");
        } finally {
          dlBtn.disabled = false;
        }
      }, "wiz-primary");
      dlBtn.id = "wizard-download";
      actions.append(fmt, dlBtn);
      if (targets.length > 1) {
        const zipBtn = btn("Download all (ZIP)", async () => {
          zipBtn.disabled = true;
          setStatus("Packing ZIP…");
          try {
            const format = state.format;
            const entries = [];
            for (const f of files) {
              const blob = await rasterize(renderPoster(project, f.target.key), format);
              entries.push({ name: f.name, bytes: new Uint8Array(await blob.arrayBuffer()) });
            }
            downloadBlob(zip(entries), slug(state.title) + "-posters.zip");
            setStatus("ZIP downloaded.");
          } catch (e) {
            setStatus(e instanceof Error ? e.message : "ZIP failed.");
          } finally {
            zipBtn.disabled = false;
          }
        }, "wiz-ghost");
        zipBtn.id = "wizard-download-zip";
        actions.append(zipBtn);
      }
      const backupBtn = btn("Save backup", () => hooks.downloadBackup(), "wiz-link");
      backupBtn.id = "wizard-backup";
      actions.append(backupBtn);
      content.append(actions);
    }
    function renderContent() {
      cancelSearches();
      const project = hooks.getProject();
      dialog.dataset.step = String(step);
      counterEl.textContent = step + " / " + STEP_TITLES.length;
      heading.textContent = STEP_TITLES[step - 1];
      statusEl.textContent = statusText;
      dialog.querySelectorAll("[data-step]").forEach((dot) => {
        const num = Number(dot.dataset.step);
        if (num === step)
          dot.setAttribute("aria-current", "step");
        else
          dot.removeAttribute("aria-current");
        dot.classList.toggle("is-done", num < step);
      });
      const stepRenderers = [renderStep1, renderStep2, renderStep3, renderStep4, renderStep5];
      content.replaceChildren();
      stepRenderers[step - 1](project);
      const hasContent = project.recordings.length > 0 || project.days.length > 0 || project.photos.length > 0;
      backBtn.hidden = step === 1;
      if (step === 1) {
        nextBtn.hidden = !hasContent;
        nextBtn.textContent = "Continue";
        nextBtn.className = "wiz-primary";
        nextBtn.onclick = () => go(2);
      } else if (step < STEP_TITLES.length) {
        nextBtn.hidden = false;
        const skip = step === 3 && !project.places.some((p) => p.visible) || step === 4 && !project.photos.length;
        nextBtn.textContent = skip ? "Skip" : "Continue";
        nextBtn.className = skip ? "wiz-ghost" : "wiz-primary";
        nextBtn.onclick = () => go(step + 1);
      } else {
        nextBtn.hidden = true;
      }
      foot.hidden = backBtn.hidden && nextBtn.hidden;
    }
    function render() {
      if (!isOpen())
        return;
      renderContent();
    }
    function reset() {
      cancelSearches();
      step = 1;
      activeDayId = "";
      showAddPlace = false;
      showStep2Search = false;
      photoDayId = "";
      expandedCropPhotoId = "";
      statusText = "";
      aiOpen = false;
      aiSettingsOpen = null;
      aiPrompt = "";
      aiBusy = false;
      aiError = "";
      aiPlan = null;
    }
    return { show, hide, render, reset, isOpen };
  }

  // src/app.ts
  var node = (id) => document.getElementById(id);
  var fileInput = node("file");
  var restoreInput = node("restore");
  var backupButton = node("backup");
  var resetButton = node("reset-trip");
  var openWizardButton = node("open-wizard");
  var status = node("storage-status");
  var message = node("message");
  var itinerary = node("itinerary");
  var assets = node("assets");
  var output = node("output");
  var wizardDialog = node("wizard-dialog");
  var project = newProject();
  var revision = 0;
  function changed() {
    const edit = ++revision;
    status.textContent = "Saving…";
    saveProject(project).then(() => {
      if (edit === revision)
        status.textContent = "Saved on this device";
    }).catch(() => {
      if (edit === revision)
        status.textContent = "Local save unavailable · Download a backup";
    });
  }
  function mergeDay(removed, kept) {
    for (const item of [...project.visits, ...project.photos])
      if (item.dayId === removed)
        item.dayId = kept;
    const out = project.output;
    for (const group of out.groups)
      group.dayIds = Array.from(new Set(group.dayIds.map((id) => id === removed ? kept : id)));
    const oldKey = "day:" + removed;
    const newKey = "day:" + kept;
    if (out.active === oldKey)
      out.active = newKey;
    out.selected = Array.from(new Set(out.selected.map((key) => key === oldKey ? newKey : key)));
    for (const settings of [out.labels, out.placeVisibility, out.placeText]) {
      if (!settings)
        continue;
      if (settings[oldKey]) {
        Object.assign(settings, { [newKey]: { ...settings[oldKey], ...settings[newKey] } });
        delete settings[oldKey];
      }
    }
  }
  function showItinerary() {
    mountItinerary(itinerary, project, () => {
      showAssets();
      showOutput();
      changed();
    }, mergeDay, (id) => deleteProjectDay(project, id), (id) => deleteProjectRecording(project, id));
  }
  function showAssets() {
    mountAssets(assets, project, () => {
      showOutput();
      changed();
    });
  }
  function showOutput() {
    mountOutput(output, project, changed);
  }
  function renderEditor() {
    showItinerary();
    showAssets();
    showOutput();
  }
  function busy(value) {
    fileInput.disabled = restoreInput.disabled = backupButton.disabled = resetButton.disabled = value;
  }
  async function importGpxFiles(files) {
    busy(true);
    const errors = [];
    let imported = 0;
    try {
      for (const file of files) {
        try {
          const [xml, original] = await Promise.all([file.text(), asDataUrl(file)]);
          const doc = parseGpx(xml);
          const waypoints = { places: [] };
          const count = importWaypoints(waypoints, doc);
          try {
            importRecording(project, xml, file.name, doc);
            if (project.recordings.length === 1 && project.output.title === newProject().output.title)
              project.output.title = file.name.replace(/\.gpx$/i, "").slice(0, 80);
          } catch (error) {
            if (!count)
              throw error;
          }
          project.places.push(...waypoints.places);
          project.sources.push({ name: file.name, original });
          imported++;
        } catch (error) {
          errors.push(file.name + " — " + error.message);
        }
      }
      if (imported) {
        changed();
        renderEditor();
      }
      const summary = [imported ? "Imported " + imported + " GPX " + (imported === 1 ? "file." : "files.") : "", ...errors].filter(Boolean).join(" ");
      message.textContent = summary;
      return summary;
    } finally {
      busy(false);
      fileInput.value = "";
    }
  }
  function downloadBackup() {
    downloadBlob(new Blob([backup(project)], { type: "application/json" }), "map-and-posters-backup.json");
  }
  async function restoreBackupFile(file) {
    busy(true);
    try {
      const restored = restore(await file.text());
      if ((project.sources.length || project.days.length || project.places.length || project.photos.length) && !window.confirm("Replace the current trip with this backup?"))
        return "";
      const previous = project;
      project = restored;
      try {
        renderEditor();
      } catch (error) {
        project = previous;
        renderEditor();
        throw error;
      }
      changed();
      const summary = "Restored " + file.name;
      message.textContent = summary;
      return summary;
    } catch (error) {
      const summary = "Could not restore this backup. " + error.message;
      message.textContent = summary;
      return summary;
    } finally {
      busy(false);
      restoreInput.value = "";
    }
  }
  function resetTrip() {
    const hasData = project.sources.length || project.days.length || project.places.length || project.photos.length;
    if (hasData && !window.confirm("Start a new trip? Unsaved changes without a backup will be cleared."))
      return;
    project = newProject();
    message.textContent = "";
    changed();
    renderEditor();
    wizard.reset();
    wizard.render();
  }
  var wizard = createWizard(wizardDialog, {
    getProject: () => project,
    importGpx: importGpxFiles,
    downloadBackup,
    restoreBackup: restoreBackupFile,
    deleteRecording: (id) => deleteProjectRecording(project, id),
    deleteDay: (id) => deleteProjectDay(project, id),
    resetTrip,
    onMutate: () => {
      changed();
      renderEditor();
    },
    onExit: () => {
      renderEditor();
    }
  });
  fileInput.onchange = async () => {
    await importGpxFiles(Array.from(fileInput.files || []));
  };
  backupButton.onclick = downloadBackup;
  resetButton.onclick = resetTrip;
  restoreInput.onchange = async () => {
    const file = restoreInput.files?.[0];
    if (file)
      await restoreBackupFile(file);
  };
  openWizardButton.onclick = () => wizard.show();
  document.querySelectorAll("[data-tab]").forEach((button) => {
    button.onclick = () => {
      const tab = button.dataset.tab;
      itinerary.hidden = tab !== "itinerary";
      assets.hidden = tab !== "assets";
      document.querySelectorAll("[data-tab]").forEach((item) => item.setAttribute("aria-pressed", String(item === button)));
    };
  });
  async function start() {
    busy(true);
    try {
      project = await loadProject() || project;
      status.textContent = project.sources.length ? "Saved on this device" : "";
    } catch {
      status.textContent = "Local save unavailable · Download a backup";
    } finally {
      renderEditor();
      busy(false);
      wizard.show();
    }
  }
  start();
})();
