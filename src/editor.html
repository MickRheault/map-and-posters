<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map &amp; Posters</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.5 Inter,Helvetica,Arial,sans-serif;color:#163e38;background:#e1e5da}header{padding:18px 4vw;background:#163e38;color:#fff9e8;font-weight:700;font-size:20px}main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;min-height:calc(100vh - 66px)}aside{padding:36px 28px;background:#f8f7ef}h1{font:normal 38px/1.1 Georgia,serif;margin:0 0 32px}label{display:block;font-weight:bold;margin:24px 0 8px}input,button{font:inherit;max-width:100%}input[type=text]{width:100%;padding:10px;border:1px solid #aeb8a7;border-radius:4px}input::file-selector-button,button{padding:10px 16px;cursor:pointer;border-radius:4px;border:1px solid #52796a}button{background:#175847;color:white;margin-top:25px}button:disabled{opacity:.5;cursor:default}#status{overflow-wrap:anywhere;font-size:14px}section{display:grid;place-items:center;padding:24px}#preview{width:min(100%,62vh);text-align:center}svg{width:100%;height:auto;display:block;box-shadow:0 6px 26px #263d302b} @media(max-width:720px){main{grid-template-columns:1fr}}
