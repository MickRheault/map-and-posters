<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map &amp; Posters — Trip editor</title>
<style>
:root{color-scheme:light;--ink:#173b33;--muted:#52685e;--paper:#fcfaf2;--line:#c9cfc1;--accent:#b45132;--brand:#206248;font:15px/1.45 "DM Sans",system-ui,sans-serif;color:var(--ink);background:#e4e6dc}*{box-sizing:border-box}
body{margin:0}.topbar{padding:15px clamp(20px,3vw,52px);background:#183e34;color:#fffae9;display:flex;align-items:center;gap:16px;justify-content:space-between;flex-wrap:wrap}.brand{font:600 22px Georgia,serif;letter-spacing:-.5px}.brand span{color:#e4b97f}.top-tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}#storage-status{font-size:13px}.top-wizard-btn{background:#fcfaf2;color:var(--ink);border:0;border-radius:6px;padding:6px 12px;min-block-size:32px;font-size:13px;font-weight:650}.top-wizard-btn:hover{background:#e9eee4}.workspace{display:grid;grid-template-columns:minmax(330px,37%) minmax(0,1fr);min-height:calc(100vh - 62px)}aside{background:var(--paper);padding:24px clamp(18px,2.5vw,42px);border-right:1px solid var(--line)}h1{margin:0 0 18px;font:42px/1 Georgia,serif;letter-spacing:-1.8px}h2{font:26px/1.15 Georgia,serif;margin:18px 0 10px}h3{font-size:16px;margin:18px 0 8px}button,input,select,textarea{font:inherit;color:inherit;max-width:100%}button,input::file-selector-button,select{background:#fffef8;border:1px solid #aab7a8;border-radius:6px;padding:6px 10px;min-block-size:34px;cursor:pointer}button:hover{border-color:#316b56;background:#e9eee4}button:disabled{opacity:.5;cursor:default}input[type=text],input[type=number],input[type=url],textarea{background:white;border:1px solid #acb8ab;border-radius:6px;padding:8px 10px}input[type=range],input[type=checkbox]{accent-color:#23634d}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,select:focus-visible,h1:focus-visible{outline:3px solid #bc6931;outline-offset:2px}
.file-button{display:inline-flex;align-items:center;cursor:pointer;background:var(--brand);color:white;font-weight:650;border-radius:6px;padding:9px 16px;position:relative}.file-button input,.restore input,.wiz-cta-file input,.wiz-ghost-file input,.wiz-link-file input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}.file-button:focus-within,.restore:focus-within,.wiz-cta-file:focus-within,.wiz-ghost-file:focus-within,.wiz-link-file:focus-within{outline:3px solid #bc6931;outline-offset:2px}.backup-tools{display:flex;align-items:center;gap:12px;margin:16px 0 6px}.restore{position:relative;text-decoration:underline;cursor:pointer}#message{font-size:14px;color:#81452e;overflow-wrap:anywhere}.tabs{display:flex;border-bottom:1px solid var(--line);gap:8px;margin:20px 0 12px}.tabs button{background:none;border:0;border-bottom:3px solid transparent;border-radius:0;font-weight:650}.tabs button[aria-pressed=true]{border-color:var(--accent)}fieldset{border:1px solid var(--line);border-radius:6px;margin:12px 0;padding:10px;min-width:0}legend{font-weight:600}aside svg{max-width:100%;height:auto}details{margin:10px 0}summary{cursor:pointer;font-weight:600}#output{padding:20px clamp(14px,2vw,38px);min-width:0}#output svg{max-width:100%;height:auto}#output:empty::after{content:"Import a recording to preview your poster.";color:var(--muted)}[hidden]{display:none!important}
#assets label,#itinerary label{display:grid;gap:3px;margin:8px 0}#assets label:has(input[type=checkbox]),#itinerary label:has(input[type=checkbox]){display:flex;align-items:center;gap:6px}#assets details{padding:6px 0;border-bottom:1px solid var(--line)}#assets button,#itinerary button{margin:3px 4px 3px 0}#assets summary,.recording-row{overflow-wrap:anywhere}.recording-row small{display:block;color:#81452e}aside label input[type=range]{width:100%}
dialog#wizard-dialog{width:min(540px,calc(100vw - 32px));max-height:calc(100dvh - 32px);margin:auto;padding:0;border:0;border-radius:18px;background:var(--paper);color:var(--ink);box-shadow:0 28px 80px rgba(10,30,24,.38);overflow:hidden}
dialog#wizard-dialog[data-step="2"],dialog#wizard-dialog[data-step="5"]{width:min(640px,calc(100vw - 32px))}
dialog#wizard-dialog[open]{display:flex;flex-direction:column}
dialog#wizard-dialog:modal{overscroll-behavior:contain}
dialog#wizard-dialog::backdrop{background:rgba(20,52,43,.92);backdrop-filter:blur(8px);overflow:hidden;overscroll-behavior:contain}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px 0}.wiz-progress{display:flex;align-items:center;gap:10px}.wiz-dots ol{list-style:none;margin:0;padding:0;display:flex;gap:6px}.wiz-dots button{width:28px;height:8px;min-block-size:24px;padding:8px 0;background:transparent;border:0;display:grid;place-items:center}.wiz-dots button::before{content:"";display:block;width:24px;height:5px;border-radius:999px;background:#d3d8cc;transition:background .15s}.wiz-dots button.is-done::before{background:#7ea392}.wiz-dots button[aria-current=step]::before{background:var(--brand)}.wiz-counter{font-size:12px;font-weight:650;color:var(--muted)}.wiz-exit{background:none;border:0;color:var(--muted);font-size:13px;padding:4px 6px;min-block-size:28px;text-decoration:underline}.wiz-exit:hover{background:none;color:var(--ink)}
.wiz-body{padding:20px 28px 16px;overflow-y:auto;display:grid;gap:16px}.wiz-body h1{margin:0;font:600 30px/1.15 Georgia,serif;letter-spacing:-.8px;text-align:center}#wizard-content{display:grid;gap:14px}.wiz-status{margin:0;min-height:1.2em;font-size:13px;color:#81452e;text-align:center}
.wiz-dropzone{border:2px dashed #aeb9ab;border-radius:14px;background:#f4f6ee;padding:44px 20px;display:grid;place-items:center;transition:border-color .15s,background .15s}.wiz-dropzone.is-drag{border-color:var(--brand);background:#e7efe8}
.wiz-cta-file{display:inline-flex;align-items:center;justify-content:center;position:relative;cursor:pointer;background:var(--brand);color:white;font-weight:650;font-size:16px;border-radius:10px;padding:13px 26px;min-block-size:48px}.wiz-cta-file:hover{background:#184f39}
.wiz-alt-links{display:flex;justify-content:center;align-items:center;gap:10px;font-size:13px;color:var(--muted)}.wiz-link,.wiz-link-file{position:relative;background:none;border:0;padding:4px;min-block-size:28px;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}.wiz-link:hover,.wiz-link-file:hover{background:none;color:var(--ink)}.wiz-sep{opacity:.5}
.wiz-route-card{position:relative;background:#eef2e6;border-radius:12px;padding:8px}.wiz-mini-map{width:100%;height:110px;display:block}.wiz-badge{position:absolute;top:10px;right:10px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
.wiz-list{display:grid;gap:8px;max-height:240px;overflow-y:auto}.wiz-rec,.wiz-stop{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fffef8;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.wiz-check{display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer}.wiz-check span{overflow-wrap:anywhere}.wiz-warn{background:#fdebe4;color:#993d20;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;white-space:nowrap}.wiz-arrows,.wiz-stop-actions,.wiz-inline-tools,.wiz-pills,.wiz-photo-bar,.wiz-export-top,.wiz-export-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.wiz-inline-tools,.wiz-photo-bar{justify-content:center}.wiz-icon{min-width:30px;min-block-size:30px;padding:2px 8px;font-size:14px}
.wiz-pills{justify-content:center}.wiz-day-pill{border-radius:999px;padding:5px 12px;font-size:13px;border:1.5px solid var(--line);background:#fffef8}.wiz-day-pill[aria-pressed=true]{border-color:var(--day-color,var(--brand));background:#eef3ec;font-weight:700}.wiz-pill-add{border-radius:999px;border-style:dashed;font-size:13px;padding:5px 12px}
.wiz-split-map{width:100%;height:auto;background:#eef2e6;border-radius:10px;cursor:crosshair;display:block}.wiz-slider{width:100%}.wiz-split-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.wiz-meta{font-size:13px;color:var(--muted);font-weight:600}
.wiz-chip{border-radius:999px;font-size:12px;padding:4px 10px;min-block-size:28px}.wiz-chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:white}.wiz-add-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}.wiz-input{width:100%;min-width:0}.wiz-select,.wiz-select-sm{min-block-size:34px;font-size:14px}.wiz-select-sm{font-size:13px;padding:4px 8px;min-block-size:30px}
.wiz-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.wiz-photo{background:#fffef8;border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:8px}.wiz-photo img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block}.wiz-photo-actions{display:flex;align-items:center;gap:5px;flex-wrap:wrap}.wiz-crop-box{display:grid;gap:4px;font-size:12px}.wiz-crop-box label{display:grid;gap:2px}.wiz-crop-box input{width:100%}
.wiz-export-top{display:grid;grid-template-columns:1fr auto auto;gap:8px}.wiz-preview{margin:0 auto;width:min(100%,420px);max-height:46vh;overflow-y:auto;line-height:0;border-radius:8px;box-shadow:0 6px 20px rgba(24,62,52,.16)}.wiz-preview.is-phone{width:min(100%,300px)}.wiz-preview svg{width:100%;height:auto}.wiz-export-bar{justify-content:center}
.wiz-primary{background:var(--brand);border-color:var(--brand);color:white;font-weight:650;padding:8px 18px}.wiz-primary:hover{background:#184f39;border-color:#184f39}.wiz-ghost,.wiz-ghost-file{position:relative;display:inline-flex;align-items:center;justify-content:center;background:#f2f5ec;border:1px solid #b5c0b2;border-radius:6px;padding:7px 14px;min-block-size:34px;font-weight:600;cursor:pointer}.wiz-ghost:hover,.wiz-ghost-file:hover{background:#e5ece1}
.wiz-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px 20px;border-top:1px solid #e2e6da}.wiz-foot button:only-child,.wiz-foot #wizard-back[hidden]+#wizard-next{margin-left:auto}
@media(max-width:850px){.workspace{grid-template-columns:minmax(300px,42%) minmax(0,1fr)}}@media(max-width:660px){.workspace{display:block}aside{border-right:0}.topbar{gap:8px}.wiz-add-row,.wiz-export-top{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">Map <span>&amp;</span> Posters</div><div class="top-tools"><button id="open-wizard" class="top-wizard-btn" type="button">Guided wizard</button><span id="storage-status" role="status"></span></div></header>
<main class="workspace"><aside><h1>Trip editor</h1>
<label class="file-button">Import GPX<input id="file" type="file" multiple accept=".gpx,application/gpx+xml"></label>
<div class="backup-tools"><button id="backup" type="button">Download backup</button><label class="restore">Restore backup<input id="restore" aria-label="Restore backup" type="file" accept=".json"></label></div>
<div id="message" role="status"></div>
<nav class="tabs" aria-label="Trip editing tools"><button type="button" data-tab="itinerary" aria-pressed="true">Itinerary</button><button type="button" data-tab="assets" aria-pressed="false">Places &amp; photos</button></nav>
<div id="itinerary"></div><div id="assets" hidden></div></aside>
<section id="output" aria-label="Poster studio"></section></main>
<dialog id="wizard-dialog" aria-labelledby="wizard-heading">
  <div class="wiz-top">
    <div class="wiz-progress">
      <nav class="wiz-dots" aria-label="Trip steps"><ol>
        <li><button type="button" data-step="1" aria-label="Step 1: Add your GPX" aria-current="step"></button></li>
        <li><button type="button" data-step="2" aria-label="Step 2: Split into days"></button></li>
        <li><button type="button" data-step="3" aria-label="Step 3: Pick stops"></button></li>
        <li><button type="button" data-step="4" aria-label="Step 4: Add photos"></button></li>
        <li><button type="button" data-step="5" aria-label="Step 5: Ready to download"></button></li>
      </ol></nav>
      <span id="wizard-counter" class="wiz-counter">1 / 5</span>
    </div>
    <button id="wizard-exit" class="wiz-exit" type="button">Full editor</button>
  </div>
  <div class="wiz-body">
    <h1 id="wizard-heading" tabindex="-1"></h1>
    <div id="wizard-content"></div>
    <p id="wizard-status" class="wiz-status" role="status"></p>
  </div>
  <div class="wiz-foot">
    <button id="wizard-back" type="button" enterkeyhint="previous">Back</button>
    <button id="wizard-next" class="wiz-primary" type="button" enterkeyhint="next"></button>
  </div>
</dialog>
<script>/* APP */</script></body></html>
